<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12162A"/>
      <stop offset="100%" stop-color="#070A14"/>
    </linearGradient>

    <!-- Neon border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B4E"/>
      <stop offset="50%" stop-color="#C08BFF"/>
      <stop offset="100%" stop-color="#FF3B4E"/>
    </linearGradient>

    <!-- Crimson backlight radial glow -->
    <radialGradient id="crimsonGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF3B4E" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#FF3B4E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF3B4E" stop-opacity="0"/>
    </radialGradient>

    <!-- Fedora crown shading -->
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D354D"/>
      <stop offset="40%" stop-color="#1A2033"/>
      <stop offset="100%" stop-color="#0E1220"/>
    </linearGradient>

    <!-- Fedora brim gradient -->
    <linearGradient id="brimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222A40"/>
      <stop offset="100%" stop-color="#0B0E18"/>
    </linearGradient>

    <!-- Tie gradient -->
    <linearGradient id="tieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A67"/>
      <stop offset="40%" stop-color="#FF3B4E"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>

    <!-- Subtle drop shadow for depth -->
    <filter id="noirGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#FF3B4E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base badge -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="url(#borderGrad)" stroke-width="2" stroke-opacity="0.85"/>

  <!-- Dramatic red noir mood lighting -->
  <circle cx="32" cy="28" r="22" fill="url(#crimsonGlow)"/>

  <!-- Mobster Group -->
  <g filter="url(#noirGlow)">
    <!-- Suit Jacket Shoulders -->
    <path d="M 10 56 C 12 45 20 41 26 40 L 32 49 L 38 40 C 44 41 52 45 54 56 Z" fill="#0C101C"/>
    <!-- Suit Lapel Left -->
    <path d="M 12 56 C 13.5 47 20 42 26 40 L 29 48.5 L 20 56 Z" fill="#171D2F"/>
    <!-- Suit Lapel Right -->
    <path d="M 52 56 C 50.5 47 44 42 38 40 L 35 48.5 L 44 56 Z" fill="#131827"/>

    <!-- Crisp White Collar -->
    <polygon points="26.5,40.5 32,47 28.5,40.5" fill="#FFFFFF"/>
    <polygon points="37.5,40.5 32,47 35.5,40.5" fill="#CBD5E1"/>

    <!-- Crimson Necktie -->
    <!-- Knot -->
    <polygon points="30.5,42.5 33.5,42.5 33,46.5 31,46.5" fill="#FF5A67"/>
    <!-- Tie Body -->
    <polygon points="31,46.2 33,46.2 34.5,58.5 32,61 29.5,58.5" fill="url(#tieGrad)"/>

    <!-- Shaded Chin & Face -->
    <path d="M 23 27 L 41 27 L 40 37.5 C 40 40 36.5 42 32 42 C 27.5 42 24 40 24 37.5 Z" fill="#080B14"/>

    <!-- Mobster Sunglasses -->
    <!-- Frame -->
    <path d="M 22 30 C 22 28.5 28.5 28.5 29.5 30 C 29.5 33.5 23 33.5 22 30 Z" fill="#030408" stroke="#333C52" stroke-width="0.8"/>
    <path d="M 34.5 30 C 35.5 28.5 42 28.5 42 30 C 41 33.5 34.5 33.5 34.5 30 Z" fill="#030408" stroke="#333C52" stroke-width="0.8"/>
    <!-- Bridge -->
    <line x1="29.2" y1="29.8" x2="34.8" y2="29.8" stroke="#333C52" stroke-width="1.2"/>
    <!-- White Lens Glints -->
    <polygon points="23.5,29.5 25.5,29.5 24,32" fill="#FFFFFF" opacity="0.9"/>
    <polygon points="36,29.5 38,29.5 36.5,32" fill="#FFFFFF" opacity="0.9"/>

    <!-- Fedora Crown -->
    <path d="M 20.5 23.5 C 19.8 17.5 23 11 26 11 C 29 11 30.5 13.5 32 13.5 C 33.5 13.5 35 11 38 11 C 41 11 44.2 17.5 43.5 23.5 Z" fill="url(#crownGrad)"/>
    <!-- Crown Crease Highlights -->
    <path d="M 26 11.5 C 28.5 11.5 30.2 13.8 32 13.8 C 33.8 13.8 35.5 11.5 38 11.5" fill="none" stroke="#4B5678" stroke-width="0.8" opacity="0.7"/>

    <!-- Crimson Hat Ribbon Band -->
    <path d="M 20.3 22 C 24 23.5 40 23.5 43.7 22 L 44.2 25 C 40 26.5 24 26.5 19.8 25 Z" fill="#FF3B4E"/>
    <!-- Gold Ribbon Accent -->
    <rect x="23.5" y="22.8" width="2.5" height="2.5" rx="0.5" fill="#FACC15" opacity="0.9"/>

    <!-- Fedora Curved Brim -->
    <path d="M 8 25 C 13.5 22.5 23 21.5 32 21.5 C 41 21.5 50.5 22.5 56 25 C 57.5 25.8 55.5 27.8 48.5 28.8 C 39.5 30.1 24.5 30.1 15.5 28.8 C 8.5 27.8 6.5 25.8 8 25 Z" fill="url(#brimGrad)"/>
    <!-- Brim Top Edge Highlight -->
    <path d="M 9.5 25.2 C 15 23 23.5 22.2 32 22.2 C 40.5 22.2 49 23 54.5 25.2" fill="none" stroke="#68769F" stroke-width="1" opacity="0.85"/>
  </g>
</svg>